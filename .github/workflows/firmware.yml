name: Firmware

# Compila el firmware para la Guition JC1060P470 (PlatformIO), pasa los tests nativos del motor y
# publica los binarios como artefacto; con una etiqueta v* los adjunta también a la release.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Instalar PlatformIO
        run: pip install platformio

      - name: Tests nativos (motor y lógica de partida)
        run: pio test -e native

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
            .pio/libdeps
          key: pio-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-

      - name: Instalar PlatformIO y esptool
        # esptool solo se usa para unir los binarios en una imagen única (merge-bin).
        run: pip install platformio "esptool>=5.2,<6"

      - name: Compilar (ESP32-P4 rev v3, con PPA)
        run: pio run -e jc1060p470

      - name: Reunir los binarios
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME//\//-}"
          B=.pio/build/jc1060p470
          BOOT_APP0=~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin
          mkdir -p dist
          cp "$B/bootloader.bin" dist/bootloader.bin
          cp "$B/partitions.bin" dist/partitions.bin
          cp "$BOOT_APP0" dist/boot_app0.bin
          cp "$B/firmware.bin" dist/firmware.bin
          # Imagen única para grabar en 0x0. OJO: borra las partidas guardadas (zona NVS).
          esptool --chip esp32p4 merge-bin -o "dist/esp32-chess-${VERSION}-completo.bin" \
            --flash-mode dio --flash-freq 80m --flash-size 16MB \
            0x2000 dist/bootloader.bin 0x8000 dist/partitions.bin \
            0xe000 dist/boot_app0.bin 0x10000 dist/firmware.bin
          cp dist/firmware.bin "dist/esp32-chess-${VERSION}-app.bin"
          (cd dist && sha256sum esp32-chess-*.bin > SHA256SUMS)
          ls -la dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: esp32-chess-firmware
          path: |
            dist/esp32-chess-*.bin
            dist/bootloader.bin
            dist/partitions.bin
            dist/boot_app0.bin
            dist/firmware.bin
            dist/SHA256SUMS

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: esp32-chess-firmware

      - name: Adjuntar el firmware a la release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            esp32-chess-*.bin
            SHA256SUMS
          generate_release_notes: true

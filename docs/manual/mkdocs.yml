site_name: Ajedrez para peques (ESP32-P4)
site_description: Cómo se juega, para niños, y notas para familias y docentes
site_url: https://reasol-edu.github.io/esp32-chess/
copyright: !ENV [MANUAL_COPYRIGHT, "Ajedrez táctil para ESP32-P4"]
docs_dir: .
site_dir: ../manual-site
use_directory_urls: false
repo_url: https://github.com/reasol-edu/esp32-chess

exclude_docs: |
  README.md
  requirements.txt
  _build.html
  *.pdf

theme:
  name: material
  language: es
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    primary: custom
    accent: custom
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.top
    - search.suggest
    - content.code.copy
    - toc.integrate

extra_css:
  - assets/theme.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - tables
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Bienvenida: index.md
  - Empezar a jugar: 01-empezar-a-jugar.md
  - Las piezas y cómo se mueven: 02-las-piezas.md
  - Elige tu animal: 03-elige-tu-animal.md
  - Ayudas para aprender: 04-ayudas.md
  - Jugar con un amigo: 05-dos-jugadores.md
  - Guardar tu partida: 06-guardar.md
  - Para familias y docentes: 07-familias-y-docentes.md
  - 'Anexo: Montar y programar el aparato': 08-montaje.md
  - 'Anexo: Glosario': 09-glosario.md

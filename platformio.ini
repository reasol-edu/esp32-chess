; Ajedrez táctil para Guition JC1060P470 (ESP32-P4, 1024x600). Base de pantalla/táctil copiada de deye-monitor.
[common]
; Misma plataforma fija que deye-monitor (Arduino 3.3.8 / IDF 5.5)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
gfx = moononournation/GFX Library for Arduino@1.6.9

[env:jc1060p470]
platform = ${common.platform}
; P4 rev v3.x (la placa es v3.2): la variante "ES pre rev.300" (esp32-p4-evboard) no arranca
board = esp32-p4_r3-evboard
framework = arduino
extra_scripts = pre:scripts/patch_gfx_p4.py
lib_deps =
	lvgl/lvgl@9.6.0
	${common.gfx}
	tamctec/TAMC_GT911@^1.0.2
upload_speed = 921600
monitor_speed = 115200
board_build.partitions = partitions.csv
; Los comentarios no pueden ir DENTRO de build_flags: cortan la lista (asi se perdieron los flags de PPA).
; PPA de LVGL 9.6 (draw unit: fill/blend): -DUSE_PPA, -DLV_USE_PPA, alineacion 128 y ppa_cache_shim.h.
build_flags =
	-Iinclude
	-Isrc/engine
	-Isrc/game
	-Isrc/ui
	-DBOARD_HAS_PSRAM
	-DLV_CONF_INCLUDE_SIMPLE
	-DCONFIG_SPIRAM_USE_CAPS_ALLOC=1
	-DBOARD_GUITION_JC1060P470
	-DSCREEN_WIDTH=1024
	-DSCREEN_HEIGHT=600
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DUSE_PPA=1
	-DLV_USE_PPA=1
	-DLV_DRAW_BUF_ALIGN=128
	-DCONFIG_LV_DRAW_BUF_ALIGN=128
	-include ppa_cache_shim.h

; Misma app SIN PPA, para comparar rendimiento (pio run -e jc1060p470_noppa).
[env:jc1060p470_noppa]
extends = env:jc1060p470
build_flags =
	-Iinclude
	-Isrc/engine
	-Isrc/game
	-Isrc/ui
	-DBOARD_HAS_PSRAM
	-DLV_CONF_INCLUDE_SIMPLE
	-DCONFIG_SPIRAM_USE_CAPS_ALLOC=1
	-DBOARD_GUITION_JC1060P470
	-DSCREEN_WIDTH=1024
	-DSCREEN_HEIGHT=600
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

; Tests unitarios del motor en el PC (sin hardware): pio test -e native
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<engine/> +<game/>
build_flags =
	-std=gnu++17
	-Isrc/engine
	-Isrc/game
	-Itest/native_shim
	-Wno-narrowing
